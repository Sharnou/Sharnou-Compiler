name: Sharnou Compiler and Native DevAgent

on:
  push:
    branches:
      - milestone-7a-control-flow
      - Sharnou-Compiler
  pull_request:
    branches:
      - Sharnou-Compiler

jobs:
  windows-stage7a:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source encoding
        shell: powershell
        run: |
          $files = Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -in @('.ps1', '.sharnou', '.md', '.yml')
          }
          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM is not allowed: $($file.FullName)"
            }
            foreach ($byte in $bytes) {
              if ($byte -gt 127) { throw "Non-ASCII byte found: $($file.FullName)" }
            }
          }
          Write-Host "PASS: ASCII source and UTF-8 without BOM."

      - name: Build native x64 examples and SharnouDevAgent
        shell: powershell
        run: .\Build.ps1

      - name: Run native compiler examples
        shell: powershell
        run: .\Run.ps1

      - name: Run control-flow regressions and SharnouDevAgent
        shell: powershell
        run: .\Test.ps1

      - name: Upload SharnouDevAgent.exe
        uses: actions/upload-artifact@v4
        with:
          name: SharnouDevAgent-windows-x64
          path: Build/Stage7A/SharnouDevAgent.exe
          if-no-files-found: error
          retention-days: 14
