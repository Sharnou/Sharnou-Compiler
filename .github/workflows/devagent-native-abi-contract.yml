name: Sharnou DevAgent Native ABI Contract

on:
  push:
    branches:
      - devagent-secure-process-broker-20261126
  pull_request:
    branches:
      - Sharnou-Compiler
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-sdk-abi-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source encoding
        shell: powershell
        run: |
          $paths = @(
            'Tests\DevAgentBroker\native-abi-manifest.json',
            'Tests\Test-DevAgentNativeAbi.ps1'
          )
          foreach ($path in $paths) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $path))
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "UTF-8 BOM is not allowed: $path"
            }
            foreach ($byte in $bytes) {
              if ($byte -gt 127) { throw "Non-ASCII source byte: $path" }
            }
          }
          Write-Host 'PASS: native ABI sources are ASCII without BOM.'

      - name: Validate Windows SDK declarations, x64 layouts, and PE import map
        shell: powershell
        run: .\Tests\Test-DevAgentNativeAbi.ps1
